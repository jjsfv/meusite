<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Locações</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #151b2d;
            --bg-tertiary: #1a2235;
            --accent-primary: #00d4aa;
            --accent-secondary: #0099ff;
            --accent-danger: #ff4757;
            --accent-warning: #ffa502;
            --text-primary: #ffffff;
            --text-secondary: #a5b4cb;
            --text-muted: #6b7789;
            --border-color: #2a3547;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #0d1425 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #root {
            min-height: 100vh;
        }

        /* Login Page */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 212, 170, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            animation: float 20s ease-in-out infinite;
        }

        .login-container::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 153, 255, 0.1) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            animation: float 15s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(30px, 30px) rotate(5deg); }
        }

        .login-box {
            background: var(--bg-secondary);
            padding: 3rem;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--border-color);
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-logo h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .login-logo p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.1);
        }

        .btn {
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #00b894 100%);
            color: white;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 170, 0.3);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-success {
            background: var(--accent-primary);
            color: white;
        }

        .btn-success:hover {
            background: #00b894;
        }

        .btn-danger {
            background: var(--accent-danger);
            color: white;
        }

        .btn-danger:hover {
            background: #ee2f3a;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        /* Dashboard Layout */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 2rem 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar-logo {
            padding: 0 2rem;
            margin-bottom: 2rem;
        }

        .sidebar-logo h2 {
            font-family: 'Crimson Pro', serif;
            font-size: 1.75rem;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-user {
            padding: 0 2rem;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-user-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
        }

        .user-details h4 {
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .user-details p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .sidebar-nav {
            list-style: none;
        }

        .sidebar-nav-item {
            margin-bottom: 0.25rem;
        }

        .sidebar-nav-link {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            padding: 0.875rem 2rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            font-weight: 500;
            border-left: 3px solid transparent;
        }

        .sidebar-nav-link:hover {
            background: rgba(0, 212, 170, 0.05);
            color: var(--accent-primary);
            border-left-color: var(--accent-primary);
        }

        .sidebar-nav-link.active {
            background: rgba(0, 212, 170, 0.1);
            color: var(--accent-primary);
            border-left-color: var(--accent-primary);
        }

        .sidebar-nav-icon {
            width: 20px;
            height: 20px;
        }

        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-family: 'Crimson Pro', serif;
            font-size: 2.5rem;
            font-weight: 700;
        }

        /* Dashboard Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 1.75rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .stat-card:hover::before {
            transform: scaleX(1);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-icon.primary {
            background: rgba(0, 212, 170, 0.1);
            color: var(--accent-primary);
        }

        .stat-icon.warning {
            background: rgba(255, 165, 2, 0.1);
            color: var(--accent-warning);
        }

        .stat-icon.danger {
            background: rgba(255, 71, 87, 0.1);
            color: var(--accent-danger);
        }

        .stat-icon.secondary {
            background: rgba(0, 153, 255, 0.1);
            color: var(--accent-secondary);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'Crimson Pro', serif;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Tables */
        .data-table-container {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .data-table-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-table-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            text-align: left;
            padding: 1rem 1.5rem;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table td {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .data-table tbody tr {
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .data-table tbody tr:hover {
            background: rgba(0, 212, 170, 0.03);
        }

        .badge {
            display: inline-block;
            padding: 0.375rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-success {
            background: rgba(0, 212, 170, 0.15);
            color: var(--accent-primary);
        }

        .badge-warning {
            background: rgba(255, 165, 2, 0.15);
            color: var(--accent-warning);
        }

        .badge-danger {
            background: rgba(255, 71, 87, 0.15);
            color: var(--accent-danger);
        }

        .badge-info {
            background: rgba(0, 153, 255, 0.15);
            color: var(--accent-secondary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 2rem;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(4px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .modal-close {
            background: var(--bg-tertiary);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: var(--border-color);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 2rem;
        }

        .modal-footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .info-item {
            background: var(--bg-tertiary);
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .info-item-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .info-item-value {
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .section-divider {
            margin: 2rem 0;
            border: none;
            height: 1px;
            background: var(--border-color);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--accent-primary);
        }

        .items-list {
            background: var(--bg-tertiary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .items-list-item {
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .items-list-item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 600;
        }

        .item-quantity {
            color: var(--text-secondary);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .alert {
            padding: 1rem 1.25rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .alert-warning {
            background: rgba(255, 165, 2, 0.1);
            border: 1px solid rgba(255, 165, 2, 0.3);
            color: var(--accent-warning);
        }

        .alert-danger {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: var(--accent-danger);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .empty-state-title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                color: black;
            }

            .sidebar,
            .page-header .btn,
            .modal-close,
            .modal-footer {
                display: none !important;
            }

            .main-content {
                margin-left: 0;
            }

            .modal-overlay {
                background: white;
                position: relative;
            }

            .modal {
                box-shadow: none;
                border: 1px solid #000;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .main-content {
                margin-left: 0;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .modal {
                max-width: 100%;
                border-radius: 0;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .select-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
        }

        .select-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.1);
        }

        .item-selector {
            margin-bottom: 1.5rem;
        }

        .item-selector-row {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: end;
        }

        .selected-items-list {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
            border: 1px solid var(--border-color);
        }

        .selected-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .selected-item:last-child {
            margin-bottom: 0;
        }

        .selected-item-info {
            flex: 1;
        }

        .selected-item-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .selected-item-qty {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .btn-icon {
            background: var(--accent-danger);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: #ee2f3a;
        }

        .textarea-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            resize: vertical;
            min-height: 100px;
        }

        .textarea-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.1);
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-xs {
            padding: 0.375rem 0.75rem;
            font-size: 0.8rem;
            border-radius: 8px;
        }

        /* Sync Indicator */
        .sync-indicator {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            animation: slideInUp 0.3s ease;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sync-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .sync-dot.online {
            background: var(--accent-primary);
        }

        .sync-dot.offline {
            background: var(--accent-danger);
        }

        .sync-dot.syncing {
            background: var(--accent-warning);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .sync-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .refresh-button {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary) 0%, #00b894 100%);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 999;
        }

        .refresh-button:hover {
            transform: scale(1.1) rotate(90deg);
        }

        .refresh-button.spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Sistema usando localStorage (modo offline)
        const DB_KEY = 'locacoes_db';

        const initDatabase = () => {
            if (!localStorage.getItem(DB_KEY)) {
                const db = {
                    usuarios: [
                        { id: 1, nome: 'Administrador', usuario: 'admin', senha: 'admin123', role: 'admin' }
                    ],
                    clientes: [],
                    itens: [
                        { id: 1, nome: 'Cadeira Plástica Branca', tipo: 'unitario', quantidadeTotal: 100, observacoes: '', status: 'ativo' },
                        { id: 2, nome: 'Mesa de 4 Lugares', tipo: 'conjunto', quantidadeTotal: 20, observacoes: '', status: 'ativo' },
                        { id: 3, nome: 'Toalha de Mesa', tipo: 'unitario', quantidadeTotal: 50, observacoes: '', status: 'ativo' },
                        { id: 4, nome: 'Pula-Pula Grande', tipo: 'unitario', quantidadeTotal: 5, observacoes: 'Com rede de proteção', status: 'ativo' },
                        { id: 5, nome: 'Piscina de Bolinhas', tipo: 'unitario', quantidadeTotal: 3, observacoes: 'Inclui 1000 bolinhas', status: 'ativo' }
                    ],
                    locacoes: [],
                    locacaoItens: [],
                    pagamentos: [],
                    recebimentos: [],
                    nextId: {
                        clientes: 1,
                        itens: 6,
                        locacoes: 1,
                        locacaoItens: 1,
                        pagamentos: 1,
                        recebimentos: 1
                    },
                    lastUpdate: new Date().toISOString()
                };
                localStorage.setItem(DB_KEY, JSON.stringify(db));
            }
        };

        const getDB = () => {
            const data = localStorage.getItem(DB_KEY);
            if (!data) {
                initDatabase();
                return JSON.parse(localStorage.getItem(DB_KEY));
            }
            return JSON.parse(data);
        };

        const setDB = (db) => {
            db.lastUpdate = new Date().toISOString();
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        };

        // Componente de indicador de sincronização
        const SyncIndicator = () => {
            const [lastUpdate, setLastUpdate] = useState(new Date().toISOString());

            useEffect(() => {
                const interval = setInterval(() => {
                    const db = getDB();
                    if (db.lastUpdate) {
                        setLastUpdate(db.lastUpdate);
                    }
                }, 1000);

                return () => clearInterval(interval);
            }, []);

            return (
                <div className="sync-indicator">
                    <div className="sync-dot online"></div>
                    <div className="sync-text">
                        <strong>Sistema Ativo</strong>
                        <div style={{fontSize: '0.75rem', marginTop: '0.25rem'}}>
                            Última atualização: {new Date(lastUpdate).toLocaleTimeString('pt-BR')}
                        </div>
                    </div>
                </div>
            );
        };

        // Componente de botão de atualização manual
        const RefreshButton = ({ onRefresh }) => {
            const [spinning, setSpinning] = useState(false);

            const handleRefresh = () => {
                setSpinning(true);
                onRefresh();
                setTimeout(() => setSpinning(false), 1000);
            };

            return (
                <button 
                    className={`refresh-button ${spinning ? 'spinning' : ''}`}
                    onClick={handleRefresh}
                    title="Atualizar dados"
                >
                    🔄
                </button>
            );
        };

        // Componente de Login
        const Login = ({ onLogin }) => {
            const [usuario, setUsuario] = useState('');
            const [senha, setSenha] = useState('');
            const [erro, setErro] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const db = getDB();
                const user = db.usuarios.find(u => u.usuario === usuario && u.senha === senha);
                
                if (user) {
                    onLogin(user);
                } else {
                    setErro('Usuário ou senha inválidos');
                }
            };

            return (
                <div className="login-container">
                    <div className="login-box">
                        <div className="login-logo">
                            <h1>LocaFácil</h1>
                            <p>Sistema de Gestão de Locações</p>
                        </div>
                        <form onSubmit={handleSubmit}>
                            {erro && (
                                <div className="alert alert-danger" style={{marginBottom: '1.5rem'}}>
                                    <span>⚠️</span>
                                    <span>{erro}</span>
                                </div>
                            )}
                            <div className="form-group">
                                <label>Usuário</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={usuario}
                                    onChange={(e) => setUsuario(e.target.value)}
                                    placeholder="Digite seu usuário"
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label>Senha</label>
                                <input
                                    type="password"
                                    className="form-input"
                                    value={senha}
                                    onChange={(e) => setSenha(e.target.value)}
                                    placeholder="Digite sua senha"
                                    required
                                />
                            </div>
                            <button type="submit" className="btn btn-primary">
                                Entrar no Sistema
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // Componente Dashboard
        const Dashboard = () => {
            const [stats, setStats] = useState({
                locacoesAtivas: 0,
                locacoesVencidas: 0,
                proximasVencer: 0,
                itensAlugados: 0,
                itensDisponiveis: 0
            });
            const [locacoesRecentes, setLocacoesRecentes] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                carregarDados();
                
                // Auto-refresh a cada 30 segundos
                const interval = setInterval(() => {
                    carregarDados();
                }, 30000);

                return () => clearInterval(interval);
            }, []);

            const carregarDados = () => {
                calcularStats();
                carregarLocacoesRecentes();
                setLoading(false);
            };

            const calcularStats = () => {
                const db = getDB();
                const hoje = new Date();
                hoje.setHours(0, 0, 0, 0);

                const ativas = db.locacoes.filter(l => l.status === 'ativa').length;
                
                const vencidas = db.locacoes.filter(l => {
                    if (l.status !== 'ativa') return false;
                    const dataFinal = new Date(l.dataFinal);
                    return dataFinal < hoje;
                }).length;

                const proximas = db.locacoes.filter(l => {
                    if (l.status !== 'ativa') return false;
                    const dataFinal = new Date(l.dataFinal);
                    const diff = Math.ceil((dataFinal - hoje) / (1000 * 60 * 60 * 24));
                    return diff >= 0 && diff <= 3;
                }).length;

                let totalItensAlugados = 0;
                db.locacoes.forEach(locacao => {
                    if (locacao.status === 'ativa') {
                        const itens = db.locacaoItens.filter(li => li.locacaoId === locacao.id);
                        itens.forEach(item => {
                            totalItensAlugados += item.quantidade;
                        });
                    }
                });

                let totalItensDisponiveis = 0;
                db.itens.forEach(item => {
                    const qtdAlugada = calcularQuantidadeAlugada(item.id, db);
                    totalItensDisponiveis += (item.quantidadeTotal - qtdAlugada);
                });

                setStats({
                    locacoesAtivas: ativas,
                    locacoesVencidas: vencidas,
                    proximasVencer: proximas,
                    itensAlugados: totalItensAlugados,
                    itensDisponiveis: totalItensDisponiveis
                });
            };

            const calcularQuantidadeAlugada = (itemId, db) => {
                let total = 0;
                db.locacoes.forEach(locacao => {
                    if (locacao.status === 'ativa') {
                        const itens = db.locacaoItens.filter(li => li.locacaoId === locacao.id && li.itemId === itemId);
                        itens.forEach(item => {
                            total += item.quantidade;
                        });
                    }
                });
                return total;
            };

            const carregarLocacoesRecentes = () => {
                const db = getDB();
                const locacoes = db.locacoes
                    .slice(-10)
                    .reverse()
                    .map(locacao => {
                        const cliente = db.clientes.find(c => c.id === locacao.clienteId);
                        return { ...locacao, clienteNome: cliente?.nome || 'Cliente não encontrado' };
                    });
                setLocacoesRecentes(locacoes);
            };

            if (loading) {
                return (
                    <div style={{display: 'flex', justifyContent: 'center', alignItems: 'center', height: '400px'}}>
                        <div style={{textAlign: 'center', color: 'var(--text-secondary)'}}>
                            <div style={{fontSize: '3rem', marginBottom: '1rem'}}>⏳</div>
                            <div>Carregando dados...</div>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    <div className="page-header">
                        <h1 className="page-title">Dashboard</h1>
                    </div>

                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-header">
                                <div>
                                    <div className="stat-value">{stats.locacoesAtivas}</div>
                                    <div className="stat-label">Locações Ativas</div>
                                </div>
                                <div className="stat-icon primary">📋</div>
                            </div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <div>
                                    <div className="stat-value" style={{color: 'var(--accent-danger)'}}>{stats.locacoesVencidas}</div>
                                    <div className="stat-label">Locações Vencidas</div>
                                </div>
                                <div className="stat-icon danger">⚠️</div>
                            </div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <div>
                                    <div className="stat-value" style={{color: 'var(--accent-warning)'}}>{stats.proximasVencer}</div>
                                    <div className="stat-label">Próximas a Vencer</div>
                                </div>
                                <div className="stat-icon warning">⏰</div>
                            </div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <div>
                                    <div className="stat-value">{stats.itensAlugados}</div>
                                    <div className="stat-label">Itens Alugados</div>
                                </div>
                                <div className="stat-icon secondary">📦</div>
                            </div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <div>
                                    <div className="stat-value">{stats.itensDisponiveis}</div>
                                    <div className="stat-label">Itens Disponíveis</div>
                                </div>
                                <div className="stat-icon primary">✓</div>
                            </div>
                        </div>
                    </div>

                    <div className="data-table-container">
                        <div className="data-table-header">
                            <h3 className="data-table-title">Locações Recentes</h3>
                        </div>
                        {locacoesRecentes.length > 0 ? (
                            <table className="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Cliente</th>
                                        <th>Data Início</th>
                                        <th>Data Fim</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {locacoesRecentes.map(locacao => (
                                        <tr key={locacao.id}>
                                            <td>#{locacao.id}</td>
                                            <td>{locacao.clienteNome}</td>
                                            <td>{locacao.dataInicial.split('T')[0].split('-').reverse().join('/')}</td>
                                            <td>{locacao.dataFinal.split('T')[0].split('-').reverse().join('/')}</td>
                                            <td>
                                                <span className={`badge badge-${locacao.status === 'ativa' ? 'success' : locacao.status === 'finalizada' ? 'info' : 'danger'}`}>
                                                    {locacao.status}
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : (
                            <div className="empty-state">
                                <div className="empty-state-icon">📋</div>
                                <h3 className="empty-state-title">Nenhuma locação registrada</h3>
                                <p>Crie sua primeira locação para começar</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Componente Clientes
        const Clientes = ({ onSelectCliente }) => {
            const [clientes, setClientes] = useState([]);
            const [modalAberto, setModalAberto] = useState(false);
            const [clienteSelecionado, setClienteSelecionado] = useState(null);
            const [modoEdicao, setModoEdicao] = useState(false);

            useEffect(() => {
                carregarClientes();
            }, []);

            const carregarClientes = () => {
                const db = getDB();
                setClientes(db.clientes);
            };

            const abrirModal = (cliente = null) => {
                setClienteSelecionado(cliente);
                setModoEdicao(!!cliente);
                setModalAberto(true);
            };

            const fecharModal = () => {
                setModalAberto(false);
                setClienteSelecionado(null);
                setModoEdicao(false);
            };

            const visualizarCliente = (cliente) => {
                if (onSelectCliente) {
                    onSelectCliente(cliente);
                }
            };

            return (
                <div>
                    <div className="page-header">
                        <h1 className="page-title">Clientes</h1>
                        <button className="btn btn-primary" onClick={() => abrirModal()}>
                            + Novo Cliente
                        </button>
                    </div>

                    <div className="data-table-container">
                        <div className="data-table-header">
                            <h3 className="data-table-title">Lista de Clientes</h3>
                        </div>
                        {clientes.length > 0 ? (
                            <table className="data-table">
                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>CPF</th>
                                        <th>Telefone</th>
                                        <th>Cidade</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {clientes.map(cliente => (
                                        <tr key={cliente.id} onClick={() => visualizarCliente(cliente)}>
                                            <td>{cliente.nome}</td>
                                            <td>{cliente.cpf}</td>
                                            <td>{cliente.telefone}</td>
                                            <td>{cliente.enderecoResidencial?.split(',')[1]?.trim() || '-'}</td>
                                            <td onClick={(e) => e.stopPropagation()}>
                                                <div className="action-buttons">
                                                    <button className="btn btn-secondary btn-xs" onClick={() => visualizarCliente(cliente)}>
                                                        Ver Ficha
                                                    </button>
                                                    <button className="btn btn-primary btn-xs" onClick={() => abrirModal(cliente)}>
                                                        Editar
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : (
                            <div className="empty-state">
                                <div className="empty-state-icon">👥</div>
                                <h3 className="empty-state-title">Nenhum cliente cadastrado</h3>
                                <p>Adicione seu primeiro cliente para começar</p>
                            </div>
                        )}
                    </div>

                    {modalAberto && (
                        <ModalCliente
                            cliente={clienteSelecionado}
                            onClose={fecharModal}
                            onSave={() => {
                                carregarClientes();
                                fecharModal();
                            }}
                        />
                    )}
                </div>
            );
        };

        // Modal Cliente
        const ModalCliente = ({ cliente, onClose, onSave }) => {
            const [formData, setFormData] = useState(cliente || {
                nome: '',
                cpf: '',
                rg: '',
                telefone: '',
                enderecoResidencial: '',
                enderecoEntrega: '',
                observacoes: ''
            });

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const db = getDB();

                if (cliente) {
                    // Editar
                    const index = db.clientes.findIndex(c => c.id === cliente.id);
                    db.clientes[index] = { ...formData, id: cliente.id };
                } else {
                    // Novo
                    const novoCliente = {
                        ...formData,
                        id: db.nextId.clientes++
                    };
                    db.clientes.push(novoCliente);
                }

                setDB(db);
                onSave();
            };

            return (
                <div className="modal-overlay">
                    <div className="modal">
                        <div className="modal-header">
                            <h2 className="modal-title">{cliente ? 'Editar Cliente' : 'Novo Cliente'}</h2>
                            <button className="modal-close" onClick={onClose}>✕</button>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="modal-body">
                                <div className="form-row">
                                    <div className="form-group">
                                        <label>Nome Completo *</label>
                                        <input
                                            type="text"
                                            name="nome"
                                            className="form-input"
                                            value={formData.nome}
                                            onChange={handleChange}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>CPF *</label>
                                        <input
                                            type="text"
                                            name="cpf"
                                            className="form-input"
                                            value={formData.cpf}
                                            onChange={handleChange}
                                            required
                                        />
                                    </div>
                                </div>
                                <div className="form-row">
                                    <div className="form-group">
                                        <label>RG</label>
                                        <input
                                            type="text"
                                            name="rg"
                                            className="form-input"
                                            value={formData.rg}
                                            onChange={handleChange}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Telefone *</label>
                                        <input
                                            type="text"
                                            name="telefone"
                                            className="form-input"
                                            value={formData.telefone}
                                            onChange={handleChange}
                                            required
                                        />
                                    </div>
                                </div>
                                <div className="form-group">
                                    <label>Endereço Residencial *</label>
                                    <input
                                        type="text"
                                        name="enderecoResidencial"
                                        className="form-input"
                                        value={formData.enderecoResidencial}
                                        onChange={handleChange}
                                        required
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Endereço de Entrega</label>
                                    <input
                                        type="text"
                                        name="enderecoEntrega"
                                        className="form-input"
                                        value={formData.enderecoEntrega}
                                        onChange={handleChange}
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Observações</label>
                                    <textarea
                                        name="observacoes"
                                        className="textarea-input"
                                        value={formData.observacoes}
                                        onChange={handleChange}
                                    />
                                </div>
                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>
                                    Cancelar
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    {cliente ? 'Salvar Alterações' : 'Cadastrar Cliente'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // Componente Ficha do Cliente
        const FichaCliente = ({ cliente, onVoltar }) => {
            const [historico, setHistorico] = useState([]);

            useEffect(() => {
                carregarHistorico();
            }, [cliente]);

            const carregarHistorico = () => {
                const db = getDB();
                const locacoesCliente = db.locacoes
                    .filter(l => l.clienteId === cliente.id)
                    .sort((a, b) => new Date(b.dataInicial) - new Date(a.dataInicial));
                setHistorico(locacoesCliente);
            };

            const imprimirFicha = () => {
                window.print();
            };

            return (
                <div>
                    <div className="page-header">
                        <h1 className="page-title">Ficha do Cliente</h1>
                        <div style={{display: 'flex', gap: '1rem'}}>
                            <button className="btn btn-secondary" onClick={imprimirFicha}>
                                🖨️ Imprimir
                            </button>
                            <button className="btn btn-primary" onClick={onVoltar}>
                                ← Voltar
                            </button>
                        </div>
                    </div>

                    <div className="data-table-container" style={{marginBottom: '2rem'}}>
                        <div className="data-table-header">
                            <h3 className="data-table-title">Dados Pessoais</h3>
                        </div>
                        <div className="modal-body">
                            <div className="info-grid">
                                <div className="info-item">
                                    <div className="info-item-label">Nome Completo</div>
                                    <div className="info-item-value">{cliente.nome}</div>
                                </div>
                                <div className="info-item">
                                    <div className="info-item-label">CPF</div>
                                    <div className="info-item-value">{cliente.cpf}</div>
                                </div>
                                <div className="info-item">
                                    <div className="info-item-label">RG</div>
                                    <div className="info-item-value">{cliente.rg || '-'}</div>
                                </div>
                                <div className="info-item">
                                    <div className="info-item-label">Telefone</div>
                                    <div className="info-item-value">{cliente.telefone}</div>
                                </div>
                                <div className="info-item">
                                    <div className="info-item-label">Endereço Residencial</div>
                                    <div className="info-item-value">{cliente.enderecoResidencial}</div>
                                </div>
                                <div className="info-item">
                                    <div className="info-item-label">Endereço de Entrega</div>
                                    <div className="info-item-value">{cliente.enderecoEntrega || 'Mesmo do residencial'}</div>
                                </div>
                            </div>
                            {cliente.observacoes && (
                                <div className="info-item" style={{marginTop: '1rem'}}>
                                    <div className="info-item-label">Observações</div>
                                    <div className="info-item-value">{cliente.observacoes}</div>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="data-table-container">
                        <div className="data-table-header">
                            <h3 className="data-table-title">Histórico de Locações</h3>
                        </div>
                        {historico.length > 0 ? (
                            <table className="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Data Início</th>
                                        <th>Data Fim</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {historico.map(locacao => (
                                        <tr key={locacao.id}>
                                            <td>#{locacao.id}</td>
                                            <td>{new Date(locacao.dataInicial).toLocaleDateString('pt-BR')}</td>
                                            <td>{new Date(locacao.dataFinal).toLocaleDateString('pt-BR')}</td>
                                            <td>
                                                <span className={`badge badge-${locacao.status === 'ativa' ? 'success' : locacao.status === 'finalizada' ? 'info' : 'danger'}`}>
                                                    {locacao.status}
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : (
                            <div className="empty-state">
                                <div className="empty-state-icon">📋</div>
                                <h3 className="empty-state-title">Sem histórico de locações</h3>
                                <p>Este cliente ainda não realizou nenhuma locação</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Componente Itens
        const Itens = () => {
            const [itens, setItens] = useState([]);
            const [modalAberto, setModalAberto] = useState(false);
            const [itemSelecionado, setItemSelecionado] = useState(null);

            useEffect(() => {
                carregarItens();
            }, []);

            const carregarItens = () => {
                const db = getDB();
                const itensComDisponibilidade = db.itens.map(item => ({
                    ...item,
                    quantidadeAlugada: calcularQuantidadeAlugada(item.id, db),
                    quantidadeDisponivel: item.quantidadeTotal - calcularQuantidadeAlugada(item.id, db)
                }));
                setItens(itensComDisponibilidade);
            };

            const calcularQuantidadeAlugada = (itemId, db) => {
                let total = 0;
                db.locacoes.forEach(locacao => {
                    if (locacao.status === 'ativa') {
                        const itens = db.locacaoItens.filter(li => li.locacaoId === locacao.id && li.itemId === itemId);
                        itens.forEach(item => {
                            total += item.quantidade;
                        });

                });
                return total;

                setItemSelecionado(item);

                setModalAberto(false);

        // Modal Item

                observacoes: '',

                const value = e.target.type === 'number' ? parseInt(e.target.value) : e.target.value;
                setFormData({ ...formData, [e.target.name]: value });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const db = getDB();

                if (item) {
                    const index = db.itens.findIndex(i => i.id === item.id);
                    db.itens[index] = { ...formData, id: item.id };

                    const novoItem = {
                        ...formData,

        // Componente Locações
        const Locacoes = () => {

                setLocacoes(locacoesComCliente);

            const abrirModalNova = () => {

                setModalFichaAberto(true);

        // Modal Nova Locação
        const ModalNovaLocacao = ({ onClose, onSave }) => {
            const [etapa, setEtapa] = useState(1);
            const [clientes, setClientes] = useState([]);
            const [itens, setItens] = useState([]);
            const [formData, setFormData] = useState({
                clienteId: '',
                dataInicial: '',
                dataFinal: '',
                dataVencimento: '',
                itens: [],
                valorTotal: 0,
                observacoes: ''
            });

            const [itemSelecionado, setItemSelecionado] = useState('');
            const [quantidade, setQuantidade] = useState(1);

            useEffect(() => {
                carregarDados();
            }, []);

            const carregarDados = () => {
                const db = getDB();
                setClientes(db.clientes);
                setItens(db.itens.filter(i => i.status === 'ativo'));
            };

            const adicionarItem = () => {
                if (!itemSelecionado || quantidade <= 0) return;

                const item = itens.find(i => i.id === parseInt(itemSelecionado));
                const quantidadeDisponivel = calcularDisponibilidade(item.id);

                if (quantidade > quantidadeDisponivel) {
                    alert(`Apenas ${quantidadeDisponivel} unidades disponíveis para este item`);
                    return;
                }

                const novoItem = {
                    itemId: item.id,
                    nome: item.nome,
                    quantidade: quantidade
                };

                setFormData({
                    ...formData,
                    itens: [...formData.itens, novoItem]
                });

                setItemSelecionado('');
                setQuantidade(1);
            };

            const removerItem = (index) => {
                const novosItens = formData.itens.filter((_, i) => i !== index);
                setFormData({ ...formData, itens: novosItens });
            };

            const calcularDisponibilidade = (itemId) => {
                const db = getDB();
                const item = db.itens.find(i => i.id === itemId);
                if (!item) return 0;

                let totalAlugado = 0;
                db.locacoes.forEach(locacao => {
                    if (locacao.status === 'ativa') {
                        const itensLocacao = db.locacaoItens.filter(li => li.locacaoId === locacao.id && li.itemId === itemId);
                        itensLocacao.forEach(il => {
                            totalAlugado += il.quantidade;
                        });
                    }
                });

                // Considerar itens já adicionados nesta locação
                const jaAdicionado = formData.itens.find(i => i.itemId === itemId);
                if (jaAdicionado) {
                    totalAlugado += jaAdicionado.quantidade;
                }

                return item.quantidadeTotal - totalAlugado;
            };

            const handleSubmit = (e) => {
                e.preventDefault();

                if (formData.itens.length === 0) {
                    alert('Adicione pelo menos um item à locação');
                    return;
                }

                const db = getDB();
                
                const novaLocacao = {
                    id: db.nextId.locacoes++,
                    clienteId: parseInt(formData.clienteId),
                    dataInicial: formData.dataInicial,
                    dataFinal: formData.dataFinal,
                    dataVencimento: formData.dataVencimento,
                    valorTotal: parseFloat(formData.valorTotal) || 0,
                    status: 'ativa',
                    observacoes: formData.observacoes,
                    criadoEm: new Date().toISOString()
                };

                db.locacoes.push(novaLocacao);

                formData.itens.forEach(item => {
                    db.locacaoItens.push({
                        id: db.nextId.locacaoItens++,
                        locacaoId: novaLocacao.id,
                        itemId: item.itemId,
                        quantidade: item.quantidade
                    });
                });

                setDB(db);
                onSave();
            };

            return (
                <div className="modal-overlay">

                                        value={formData.clienteId}

                                        required
                                    >

                                            <option key={cliente.id} value={cliente.id}>{cliente.nome}</option>

                                </div>

                                    <div className="form-group">
                                        <label>Data Inicial *</label>
                                        <input
                                            type="date"
                                            className="form-input"
                                            value={formData.dataInicial}
                                            onChange={(e) => setFormData({...formData, dataInicial: e.target.value})}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Data Final *</label>
                                        <input
                                            type="date"
                                            className="form-input"
                                            value={formData.dataFinal}
                                            onChange={(e) => setFormData({...formData, dataFinal: e.target.value})}
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Previsão de Pagamento *</label>
                                        <input
                                            type="date"
                                            className="form-input"
                                            value={formData.dataVencimento}
                                            onChange={(e) => setFormData({...formData, dataVencimento: e.target.value})}
                                            required
                                        />
                                    </div>
                                </div>

                                <hr className="section-divider" />

                                <h3 className="section-title">Adicionar Itens</h3>

                                <div className="item-selector-row">
                                    <div className="form-group">
                                        <label>Item</label>
                                        <select
                                            className="select-input"
                                            value={itemSelecionado}
                                            onChange={(e) => setItemSelecionado(e.target.value)}

                                            <option value="">Selecione um item</option>
                                            {itens.map(item => (
                                                <option key={item.id} value={item.id}>
                                                    {item.nome} (Disponível: {calcularDisponibilidade(item.id)})
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="form-group">
                                        <label>Quantidade</label>
                                        <input
                                            type="number"
                                            className="form-input"
                                            value={quantidade}
                                            onChange={(e) => setQuantidade(parseInt(e.target.value))}

                            </div>
                            <div className="modal-footer">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>
                                    Cancelar
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    Criar Locação
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const ModalFichaLocacao = ({ locacao, onClose, onUpdate }) => {

            useEffect(() => {
                carregarDados();

                const db = getDB();
                const cliente = db.clientes.find(c => c.id === locacao.clienteId);
                const itensLocacao = db.locacaoItens
                    .filter(li => li.locacaoId === locacao.id)
                    .map(li => {
                        const item = db.itens.find(i => i.id === li.itemId);
                        return {
                            ...li,
                            nome: item?.nome || 'Item não encontrado'
                        };

                setDadosCompletos({

                    cliente,
                    itens: itensLocacao

                    db.locacoes[index].finalizadaEm = new Date().toISOString();
                    setDB(db);
                    onUpdate();

                    db.locacoes = db.locacoes.filter(l => l.id !== locacao.id);

                    if (db.recebimentos) {

            const [locacaoSelecionada, setLocacaoSelecionada] = useState(null);

            const carregarDadosFinanceiros = () => {
                try {
                    const db = getDB();
                    
                    // Garantir que os arrays existem
                    if (!db.locacoes) db.locacoes = [];
                    if (!db.clientes) db.clientes = [];
                    if (!db.recebimentos) db.recebimentos = [];
                    
                    const hoje = new Date();
                    hoje.setHours(0, 0, 0, 0);
                    
                    // Calcular resumo financeiro
                    let totalReceber = 0;
                    let totalRecebido = 0;
                    let locacoesAtivas = 0;

                    const todasTransacoes = [];

                    db.locacoes.forEach(locacao => {
                        const cliente = db.clientes.find(c => c.id === locacao.clienteId);
                        const pagamentos = db.recebimentos.filter(r => r.locacaoId === locacao.id);
                        
                        const valorTotal = parseFloat(locacao.valorTotal) || 0;
                        const valorPago = pagamentos.reduce((acc, p) => acc + parseFloat(p.valor), 0);
                        const valorPendente = valorTotal - valorPago;

                        // Verificar se o pagamento está vencido
                        let statusPagamento = 'em_dia';
                        if (locacao.dataVencimento && valorPendente > 0) {
                            const dataVenc = new Date(locacao.dataVencimento);
                            dataVenc.setHours(0, 0, 0, 0);
                            if (dataVenc < hoje) {
                                statusPagamento = 'vencido';
                            } else {
                                const diffDias = Math.ceil((dataVenc - hoje) / (1000 * 60 * 60 * 24));
                                if (diffDias <= 3) {
                                    statusPagamento = 'proximo_vencimento';
                                }
                            }
                        }

                        if (locacao.status === 'ativa') {
                            locacoesAtivas++;
                            totalReceber += valorTotal;
                            totalRecebido += valorPago;
                        }

                        todasTransacoes.push({
                            locacaoId: locacao.id,
                            clienteNome: cliente?.nome || 'Cliente não encontrado',
                            dataLocacao: locacao.dataInicial,
                            dataVencimento: locacao.dataVencimento,
                            valorTotal: valorTotal,
                            valorPago: valorPago,
                            valorPendente: valorPendente,
                            status: locacao.status,
                            statusPagamento: statusPagamento,
                            pagamentos: pagamentos
                        });
                    });

                    setResumo({
                        totalReceber: totalReceber,
                        totalRecebido: totalRecebido,
                        totalPendente: totalReceber - totalRecebido,
                        locacoesAtivas: locacoesAtivas
                    });

                    setTransacoes(todasTransacoes.sort((a, b) => b.locacaoId - a.locacaoId));
                } catch (error) {
                    console.error('Erro ao carregar dados financeiros:', error);
                    // Definir valores padrão em caso de erro
                    setResumo({
                        totalReceber: 0,
                        totalRecebido: 0,
                        totalPendente: 0,
                        locacoesAtivas: 0
                    });
                    setTransacoes([]);

            const [formData, setFormData] = useState({
                valor: locacao.valorPendente,
                formaPagamento: 'dinheiro',
                dataPagamento: new Date().toISOString().split('T')[0],
                observacoes: ''

            const handleSubmit = (e) => {
                e.preventDefault();
                
                console.log('=== REGISTRANDO PAGAMENTO ===');
                console.log('FormData:', formData);
                console.log('Locação:', locacao);
                
                if (formData.valor <= 0 || formData.valor > locacao.valorPendente) {
                    alert('Valor inválido');
                    return;
                }

                const db = getDB();
                
                // Garantir que arrays existem
                if (!db.recebimentos) db.recebimentos = [];
                if (!db.nextId) db.nextId = {};
                if (!db.nextId.recebimentos) db.nextId.recebimentos = 1;
                
                console.log('DB antes:', db.recebimentos);
                
                const novoRecebimento = {
                    id: db.nextId.recebimentos++,
                    locacaoId: locacao.locacaoId,
                    valor: parseFloat(formData.valor),
                    formaPagamento: formData.formaPagamento,
                    dataPagamento: formData.dataPagamento,
                    observacoes: formData.observacoes,
                    criadoEm: new Date().toISOString()
                };

                console.log('Novo recebimento:', novoRecebimento);
                
                db.recebimentos.push(novoRecebimento);
                setDB(db);
                
                console.log('DB depois:', db.recebimentos);
                console.log('Pagamento registrado com sucesso!');
                
                alert('Pagamento registrado com sucesso!');
                onSave();

        ReactDOM.render(<App />, document.getElementById('root'));
